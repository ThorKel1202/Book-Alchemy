<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Book Overview</title>
  <style>
  form {
    margin-bottom: 15px;
  }

  input[type="text"] {
    padding: 10px;
    width: 250px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
  }

  button {
    padding: 10px 15px;
    margin-left: 5px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }

  button:hover {
    background-color: #555;
  }

  a {
    display: inline-block;
    padding: 10px 15px;
    margin-right: 10px;
    background-color: #333;
    color: white;
    text-decoration: none;
    border-radius: 5px;
  }

  a:hover {
    background-color: #555;
  }
</style>
</head>
<body>
  <form action="/" method="GET">
    <input type="text" name="search" placeholder="Search for a book">
    <button type="submit">Search</button>
  </form>
  <div>
    <a href="/?sort_by=title">Sort by title</a>
    <a href="/?sort_by=author">Sort by author</a>
  </div>

  {% for book in books %}
    <div>
      <h3>{{ book.title }}</h3>
      <p>Author: {{ book.author.name }}</p>

      <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
           alt="Kein Cover für {{ book.title }}">
    </div>
  {% else %}
    <p>No book found for this search!</p>
  {% endfor %}

</body>
</html>
