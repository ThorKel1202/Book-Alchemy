<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ author.name }}</title>
</head>

<body>

    <h1>{{ author.name }}</h1>

    <p><strong>Birth date:</strong> {{ author.birthdate }}</p>
    <p><strong>Date of death:</strong> {{ author.date_of_death }}</p>

    <h2>Books</h2>

    {% for book in author.books %}
        <p>
            <a href="{{ url_for('book_detail', book_id=book.id) }}">
                {{ book.title }}
            </a>
        </p>
    {% else %}
        <p>Dieser Autor hat keine Bücher in der Bibliothek.</p>
    {% endfor %}

    <br>

    <a href="/">Zurück zur Bibliothek</a>

</body>
</html>
