<!DOCTYPE html>

<html lang="en">

<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta http-equiv="X-UA-Compatible" content="ie=edge">

<title>AaA - Add an Author</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: #f4f4f4;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .form-card {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 11px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }

    button:hover {
        background-color: #555;
    }

    .success-message {
        margin-top: 20px;
        text-align: center;
        font-weight: bold;
    }

    .back-button {
        text-align: center;
    }

    .button {
        display: inline-block;
        padding: 10px 18px;
        margin-top: 30px;
        background-color: #333;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
    }

    .button:hover {
        background-color: #555;
    }
</style>

</head>

<body>

<div class="container">

<h1>✍️ Add an Author</h1>

<div class="form-card">

    <form action="/add_author" method="POST">

        <div class="form-group">
            <label for="name">Author Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="birthdate">Date of birth:</label>

            <input
                type="date"
                id="birthdate"
                name="birthdate"
                required
            >
        </div>

        <div class="form-group">
            <label for="date_of_death">Date of death:</label>

            <input
                type="date"
                id="date_of_death"
                name="date_of_death"
            >
        </div>

        <button type="submit">
            Add Author
        </button>

    </form>

</div>

{% if success %}
    <p class="success-message">{{ success }}</p>
{% endif %}

<div class="back-button">

    <a href="{{ url_for('home') }}" class="button">
        📚 Back to the library
    </a>

</div>

</div>

</body> </html>
